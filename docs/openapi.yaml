openapi: 3.1.0
info:
  title: Party Finder API
  version: 2.0.0
  summary: Shared calendar of plans
  description: |
    Contract v2 between Backend (`apps/api`) and Frontend (`apps/web`).
    The Zod schemas in `packages/shared` are the executable version of this document;
    both must always agree (a test in `packages/shared` checks routes, status codes and
    the exact auth message texts). See `docs/contract-changelog.md` for what changed.

    ## Sessions
    The session travels in an `httpOnly`, `Secure`, `SameSite=Lax` cookie set only by
    `POST /auth/login`. Register and email verification never open a session.
    The API never returns session tokens.

    ## CSRF
    Every `POST`, `PATCH` and `DELETE` request must send the `X-CSRF-Token` header,
    including the public auth endpoints. Get the token from `GET /auth/csrf`. The token
    is bound to the current (anonymous or authenticated) session, so fetch a new one after
    login and logout. A missing or wrong token returns `403 CSRF_INVALID`.

    ## Email verification
    An account cannot log in until its email is verified.
    1. `POST /auth/register` (username, email, password, CAPTCHA) creates an unverified
       user and answers `202` with the generic message
       "Si los datos son válidos, recibirás un correo electrónico." No session is opened.
       If the email already belongs to an account, nothing is created and the email sent
       says so instead of carrying a link; the HTTP response is exactly the same.
    2. The email links to the **web app**, never to the API:
       `{WEB_ORIGIN}/verificar-email?token=<token>`. The token is 32 random bytes,
       base64url-encoded without padding (43 chars), valid for 24 hours and single use.
       The database stores only the SHA-256 of that token string (64 lowercase hex chars),
       never the token itself.
    3. The `/verificar-email` page reads the token from its URL and sends it in the
       **body** of `POST /auth/verify-email`. The token never goes in an API query
       string. The page uses `Referrer-Policy: no-referrer`.
    4. Any token problem (malformed, unknown, expired, already used) is
       `400 INVALID_OR_EXPIRED_TOKEN`, with no further detail.
    5. Logging in with the correct password on an unverified account returns
       `403 EMAIL_NOT_VERIFIED` (no session). With a wrong password it is always
       `401 INVALID_CREDENTIALS`, verified or not.
    6. `POST /auth/resend-verification` (`{ email }`) always answers `202` with the same
       generic message as register. If the email belongs to an unverified account, previous
       tokens are invalidated and a new one is sent. Limits: 1 per minute and 5 per day per
       email (applied equally to unknown emails), on top of the per-IP limit; over the
       limit → `429 RATE_LIMITED`.

    Unverified accounts are deleted 7 days after sign-up, freeing username and email.
    Email addresses are trimmed and lowercased before validation and storage.

    The exact texts of the auth messages are part of the contract (`AUTH_MESSAGES` in
    `@party-finder/shared`): the UI shows them verbatim. They are pinned with `const`
    in the response schemas below.

    ## Errors
    Every non-2xx response uses the single `ApiError` format `{ code, message, details? }`.
    `message` is a human-readable Spanish text that the UI may show. Validation errors
    (`400 VALIDATION_ERROR`) carry `details.issues[]` with the path of each offending field.
    Unknown body fields are rejected with `400 VALIDATION_ERROR`.

    Besides the responses listed per operation, any endpoint may return
    `429 RATE_LIMITED` (general per-IP limit, with a `Retry-After` header) and
    `500 INTERNAL_ERROR`.

    ## Dates and times
    - Calendar dates are `YYYY-MM-DD` with no time zone.
    - `startTime` and `endTime` are times of day `HH:mm`; the date comes from the calendar entry.
      `endTime` may be earlier than `startTime` (the event runs past midnight).
    - Timestamps (`createdAt`, `updatedAt`) are ISO 8601 in UTC.
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
servers:
  - url: /api
    description: Same origin, through the Vite dev proxy or Caddy (prefix stripped)
  - url: http://localhost:3000
    description: API directly, local development
tags:
  - name: auth
    description: Registration, login and session
  - name: event-templates
    description: Reusable event templates (the "Eventos" module)
  - name: uploads
    description: Image uploads for templates
  - name: calendar
    description: Calendar entries and attendance

paths:
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Create an unverified user and send the verification email
      description: >-
        Requires a valid Cloudflare Turnstile token. Usernames are unique case-insensitively.
        Does **not** open a session and does not return the user. The `202` response is
        identical whether the email is new or already registered (in that case nothing is
        created and the email sent tells the owner they already have an account). Only a
        taken username, which is public, returns `409`. If sending the email fails the
        response is still `202`; the user can ask for a resend.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '202':
          $ref: '#/components/responses/VerificationEmailSent'
        '400':
          $ref: '#/components/responses/BadRequestOrCaptcha'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '409':
          description: '`USERNAME_TAKEN`: the username already exists (verified or not).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: USERNAME_TAKEN
                message: Ese nombre de usuario ya está en uso
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/verify-email:
    post:
      tags: [auth]
      operationId: verifyEmail
      summary: Verify an account with the token from the email link
      description: >-
        Called by the web page `/verificar-email?token=…` when it loads, with the token in
        the body (never in a query string). Checks the SHA-256 of the token, its expiry
        (24 h) and that it is unused, then sets the user's `email_verified_at` and the
        token's `used_at` in one transaction. Does **not** open a session: the user logs in
        afterwards. Strict per-IP rate limit.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyEmailRequest'
      responses:
        '200':
          description: Account verified.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VerifyEmailResponse'
        '400':
          description: >-
            `INVALID_OR_EXPIRED_TOKEN` when the token is malformed, unknown, expired or already
            used, always with the same message and no `details`. `VALIDATION_ERROR` only when
            the body is not `{ token: string }`. The UI treats any 400 as "link expired" and
            offers a resend.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/InvalidOrExpiredTokenError'
                  - $ref: '#/components/schemas/ValidationError'
              examples:
                invalidToken:
                  value:
                    code: INVALID_OR_EXPIRED_TOKEN
                    message: El enlace de verificación no es válido o ha caducado.
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/resend-verification:
    post:
      tags: [auth]
      operationId: resendVerification
      summary: Send a new verification email
      description: >-
        Always answers `202` with the same generic message as register, whether the email is
        unknown, unverified or already verified. For an unverified account it invalidates
        previous tokens and sends a new one. Limits: 1 per minute and 5 per day per email
        (counted the same for unknown emails) plus a per-IP limit; over the limit →
        `429 RATE_LIMITED`. `400` only for a malformed body, which does not depend on whether
        the email exists.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResendVerificationRequest'
      responses:
        '202':
          $ref: '#/components/responses/VerificationEmailSent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Open a session
      description: >-
        Login is by **username** and password. Strict rate limit per IP and per username,
        with progressive delay after failures. The email-verification check happens only
        after the password has been validated.
      security: []
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Logged in; the session cookie is set.
          headers:
            Set-Cookie:
              $ref: '#/components/headers/SetSessionCookie'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          description: >-
            `INVALID_CREDENTIALS`. Always the same generic message, whether the username
            does not exist or the password is wrong (verified account or not).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvalidCredentialsError'
              example:
                code: INVALID_CREDENTIALS
                message: Usuario o contraseña incorrectos.
        '403':
          description: >-
            `EMAIL_NOT_VERIFIED`: the password is correct but the email is not verified yet;
            no session is opened. The UI offers to resend the email: since login is by
            username, it asks the user for their email and calls
            `POST /auth/resend-verification`. Or `CSRF_INVALID`.
          content:
            application/json:
              schema:
                anyOf:
                  - $ref: '#/components/schemas/EmailNotVerifiedError'
                  - $ref: '#/components/schemas/ApiError'
              examples:
                emailNotVerified:
                  value:
                    code: EMAIL_NOT_VERIFIED
                    message: Debes verificar tu correo electrónico antes de iniciar sesión.
                csrf:
                  value:
                    code: CSRF_INVALID
                    message: Token CSRF no válido
        '429':
          $ref: '#/components/responses/RateLimited'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Close the current session
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Session destroyed and cookie cleared.
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'

  /auth/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: Current user, or null without a session
      security:
        - {}
        - sessionCookie: []
      responses:
        '200':
          description: Never fails for anonymous visitors; `user` is `null` instead.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'

  /auth/csrf:
    get:
      tags: [auth]
      operationId: getCsrfToken
      summary: Get a CSRF token for the current session (anonymous or authenticated)
      security:
        - {}
        - sessionCookie: []
      responses:
        '200':
          description: Token to send in the `X-CSRF-Token` header.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CsrfResponse'

  /event-templates:
    get:
      tags: [event-templates]
      operationId: listEventTemplates
      summary: List all templates, newest first
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 20
      responses:
        '200':
          description: One page of templates.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTemplatePage'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
    post:
      tags: [event-templates]
      operationId: createEventTemplate
      summary: Create a template owned by the current user
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEventTemplateRequest'
      responses:
        '201':
          description: Template created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'

  /event-templates/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    patch:
      tags: [event-templates]
      operationId: updateEventTemplate
      summary: Partially update a template (owner only)
      description: >-
        Changes are reflected in every calendar entry that uses the template.
        Send `null` to clear an optional field; omit a field to leave it unchanged.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateEventTemplateRequest'
      responses:
        '200':
          description: Updated template.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventTemplate'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [event-templates]
      operationId: deleteEventTemplate
      summary: Delete a template (owner only)
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Template deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`TEMPLATE_IN_USE`: at least one calendar entry uses this template.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: TEMPLATE_IN_USE
                message: La plantilla está en uso en el calendario

  /uploads/image:
    post:
      tags: [uploads]
      operationId: uploadImage
      summary: Upload a template image
      description: >-
        Max 5 MB (5242880 bytes). Accepted types: JPEG, PNG and WebP, checked on the real
        file content, not the declared type. SVG is rejected. The image is re-encoded to
        WebP and stored under a random name. Use the returned `url` as `imageUrl`.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  contentMediaType: application/octet-stream
                  description: The image file.
            encoding:
              file:
                contentType: image/jpeg, image/png, image/webp
      responses:
        '201':
          description: Image stored.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadImageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '413':
          description: '`PAYLOAD_TOO_LARGE`: the file exceeds 5 MB.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: '`UNSUPPORTED_MEDIA_TYPE`: not a JPEG, PNG or WebP image.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /calendar:
    get:
      tags: [calendar]
      operationId: getCalendar
      summary: Entries between two dates (both inclusive)
      description: >-
        Public. The range may cover at most 42 days (`to - from + 1 <= 42`), enough for a
        6-week month grid. `isAttending` and `canDelete` are computed for the current user
        and are `false` without a session.
      security:
        - {}
        - sessionCookie: []
      parameters:
        - name: from
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/IsoDate'
        - name: to
          in: query
          required: true
          schema:
            $ref: '#/components/schemas/IsoDate'
      responses:
        '200':
          description: Entries ordered by date, then creation time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarResponse'
        '400':
          $ref: '#/components/responses/BadRequest'

  /calendar/entries:
    post:
      tags: [calendar]
      operationId: createCalendarEntry
      summary: Add a template to a day
      description: >-
        At most 4 entries per date, checked inside a transaction that locks the date.
        `capacity` (1–10) is fixed once created; the UI pre-selects the template's `attendees`.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCalendarEntryRequest'
      responses:
        '201':
          description: Entry created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`DAY_FULL`: the date already has 4 entries.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              example:
                code: DAY_FULL
                message: Este día ya tiene 4 eventos

  /calendar/entries/{id}:
    parameters:
      - $ref: '#/components/parameters/Id'
    delete:
      tags: [calendar]
      operationId: deleteCalendarEntry
      summary: Remove an entry from its day (only the user who added it)
      description: Its attendances are deleted with it.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: Entry deleted.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/ForbiddenOrCsrf'
        '404':
          $ref: '#/components/responses/NotFound'

  /calendar/entries/{id}/attendance:
    parameters:
      - $ref: '#/components/parameters/Id'
    post:
      tags: [calendar]
      operationId: attend
      summary: Sign the current user up for an entry
      description: The entry row is locked while attendees are counted against `capacity`.
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '201':
          description: Signed up. Returns the entry with the updated attendee list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalendarEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: '`ENTRY_FULL` (no places left) or `ALREADY_ATTENDING`.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
              examples:
                full:
                  value:
                    code: ENTRY_FULL
                    message: El evento está completo
                already:
                  value:
                    code: ALREADY_ATTENDING
                    message: Ya estás apuntado a este evento
    delete:
      tags: [calendar]
      operationId: unattend
      summary: Remove the current user from an entry
      parameters:
        - $ref: '#/components/parameters/CsrfToken'
      responses:
        '204':
          description: No longer attending.
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/CsrfInvalid'
        '404':
          description: '`NOT_FOUND`: the entry does not exist or the user is not attending it.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

security:
  - sessionCookie: []

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: pf_session
      description: Opaque session id in an httpOnly cookie. Clients never read it.

  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        $ref: '#/components/schemas/Uuid'
    CsrfToken:
      name: X-CSRF-Token
      in: header
      required: true
      description: Token from `GET /auth/csrf`.
      schema:
        type: string
        minLength: 1

  headers:
    SetSessionCookie:
      description: '`pf_session=<opaque>; HttpOnly; Secure; SameSite=Lax; Path=/`'
      schema:
        type: string

  responses:
    VerificationEmailSent:
      description: >-
        Accepted. Always exactly this body, whatever the email (new, registered, verified,
        unknown), so the response never reveals which emails are registered. No session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/VerificationEmailSentResponse'
          example:
            message: Si los datos son válidos, recibirás un correo electrónico.
    BadRequest:
      description: '`VALIDATION_ERROR`: body, query or path failed validation.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationError'
          example:
            code: VALIDATION_ERROR
            message: Datos no válidos
            details:
              issues:
                - path: [capacity]
                  message: Máximo 10
    BadRequestOrCaptcha:
      description: '`VALIDATION_ERROR`, or `CAPTCHA_FAILED` when the Turnstile token is rejected.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            validation:
              value:
                code: VALIDATION_ERROR
                message: Datos no válidos
                details:
                  issues:
                    - path: [username]
                      message: Mínimo 3 caracteres
            captcha:
              value:
                code: CAPTCHA_FAILED
                message: No se pudo verificar el CAPTCHA
    Unauthenticated:
      description: '`UNAUTHENTICATED`: a session is required.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: UNAUTHENTICATED
            message: Debes iniciar sesión
    CsrfInvalid:
      description: '`CSRF_INVALID`: missing or wrong `X-CSRF-Token`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: CSRF_INVALID
            message: Token CSRF no válido
    ForbiddenOrCsrf:
      description: '`FORBIDDEN` (not the owner / creator) or `CSRF_INVALID`.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          examples:
            forbidden:
              value:
                code: FORBIDDEN
                message: No tienes permiso para esta acción
            csrf:
              value:
                code: CSRF_INVALID
                message: Token CSRF no válido
    NotFound:
      description: '`NOT_FOUND`: the resource does not exist.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: NOT_FOUND
            message: No encontrado
    RateLimited:
      description: '`RATE_LIMITED`: too many attempts.'
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
            minimum: 0
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
          example:
            code: RATE_LIMITED
            message: Demasiados intentos, prueba más tarde

  schemas:
    Uuid:
      type: string
      format: uuid
    IsoDate:
      type: string
      format: date
      description: Calendar date `YYYY-MM-DD`, no time zone.
      examples: ['2026-10-12']
    IsoDateTime:
      type: string
      format: date-time
      description: UTC timestamp.
    TimeOfDay:
      type: string
      pattern: '^([01]\d|2[0-3]):[0-5]\d$'
      description: Time of day `HH:mm`, 24-hour clock.
      examples: ['18:30']
    Capacity:
      type: integer
      minimum: 1
      maximum: 10
    EventType:
      type: string
      enum: [LAN_PARTY, JUEGO_ONLINE, PLAN_GATO, DND, PASEO, PSICOLOGO, PELUQUERIA, OTROS]
      description: >-
        Spanish labels live in `@party-finder/shared` (`EVENT_TYPE_LABELS`): LAN PARTY,
        Juego online, Plan de Gato, D&D, Paseo, Psicólogo, Peluquería, Otros.

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          description: >-
            Machine-readable code. Known values: VALIDATION_ERROR, CAPTCHA_FAILED,
            UNAUTHENTICATED, INVALID_CREDENTIALS, EMAIL_NOT_VERIFIED, INVALID_OR_EXPIRED_TOKEN,
            CSRF_INVALID, FORBIDDEN, NOT_FOUND, USERNAME_TAKEN, TEMPLATE_IN_USE, DAY_FULL,
            ENTRY_FULL, ALREADY_ATTENDING, PAYLOAD_TOO_LARGE, UNSUPPORTED_MEDIA_TYPE,
            RATE_LIMITED, INTERNAL_ERROR. Clients must tolerate unknown codes.
        message:
          type: string
        details: {}
    ValidationError:
      allOf:
        - $ref: '#/components/schemas/ApiError'
        - type: object
          required: [details]
          properties:
            details:
              $ref: '#/components/schemas/ValidationErrorDetails'
    ValidationErrorDetails:
      type: object
      required: [issues]
      properties:
        issues:
          type: array
          items:
            type: object
            required: [path, message]
            properties:
              path:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              message:
                type: string
    InvalidCredentialsError:
      type: object
      required: [code, message]
      description: Login failure. Exact, generic text.
      properties:
        code:
          type: string
          const: INVALID_CREDENTIALS
        message:
          type: string
          const: Usuario o contraseña incorrectos.
    EmailNotVerifiedError:
      type: object
      required: [code, message]
      description: Correct password, unverified email. Exact text; no `details`.
      properties:
        code:
          type: string
          const: EMAIL_NOT_VERIFIED
        message:
          type: string
          const: Debes verificar tu correo electrónico antes de iniciar sesión.
    InvalidOrExpiredTokenError:
      type: object
      required: [code, message]
      description: Any verification-token problem. Exact text; no `details`.
      properties:
        code:
          type: string
          const: INVALID_OR_EXPIRED_TOKEN
        message:
          type: string
          const: El enlace de verificación no es válido o ha caducado.

    UserSummary:
      type: object
      required: [id, username]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        username:
          type: string

    Email:
      type: string
      format: email
      maxLength: 254
      description: >-
        Trimmed and lowercased before validation; the lowercased value is what is stored
        and compared (`Ana@Example.com` = `ana@example.com`). Max 254 chars after trimming.
      examples: ['ana@example.com']
    RegisterRequest:
      type: object
      additionalProperties: false
      required: [username, email, password, captchaToken]
      properties:
        username:
          type: string
          minLength: 3
          maxLength: 30
          pattern: '^[A-Za-z0-9_-]+$'
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          minLength: 8
          maxLength: 128
        captchaToken:
          type: string
          minLength: 1
          maxLength: 2048
          description: Cloudflare Turnstile token.
    VerificationEmailSentResponse:
      type: object
      required: [message]
      description: Body of every `202` of register and resend-verification.
      properties:
        message:
          type: string
          const: Si los datos son válidos, recibirás un correo electrónico.
    VerifyEmailRequest:
      type: object
      additionalProperties: false
      required: [token]
      properties:
        token:
          type: string
          minLength: 1
          maxLength: 256
          description: >-
            The `token` query parameter of the web link, sent as is (base64url, 43 chars).
            Only the shape is validated; a malformed token gets `400 INVALID_OR_EXPIRED_TOKEN`.
    VerifyEmailResponse:
      type: object
      required: [message]
      description: No session is opened and no user data is returned.
      properties:
        message:
          type: string
          const: Tu cuenta está verificada. Ya puedes iniciar sesión.
    ResendVerificationRequest:
      type: object
      additionalProperties: false
      required: [email]
      properties:
        email:
          $ref: '#/components/schemas/Email'
    LoginRequest:
      type: object
      additionalProperties: false
      required: [username, password]
      description: >-
        Login is by username. Only the shape is validated; a malformed username yields the
        generic 401.
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 120
        password:
          type: string
          minLength: 1
          maxLength: 128
    AuthUserResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: '#/components/schemas/UserSummary'
    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/UserSummary'
            - type: 'null'
    CsrfResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string
          minLength: 1

    EventTemplate:
      type: object
      required:
        [
          id,
          owner,
          name,
          description,
          type,
          imageUrl,
          attendees,
          startTime,
          endTime,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        owner:
          $ref: '#/components/schemas/UserSummary'
        name:
          type: string
        description:
          type: string
        type:
          $ref: '#/components/schemas/EventType'
        imageUrl:
          type: [string, 'null']
        attendees:
          description: Default capacity offered when adding the template to a day.
          oneOf:
            - $ref: '#/components/schemas/Capacity'
            - type: 'null'
        startTime:
          oneOf:
            - $ref: '#/components/schemas/TimeOfDay'
            - type: 'null'
        endTime:
          oneOf:
            - $ref: '#/components/schemas/TimeOfDay'
            - type: 'null'
        createdAt:
          $ref: '#/components/schemas/IsoDateTime'
        updatedAt:
          $ref: '#/components/schemas/IsoDateTime'
    CreateEventTemplateRequest:
      type: object
      additionalProperties: false
      required: [name, description, type]
      description: '`name` and `description` are trimmed before validation.'
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          minLength: 1
          maxLength: 1000
        type:
          $ref: '#/components/schemas/EventType'
        imageUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
          description: A URL returned by `POST /uploads/image`; other hosts are rejected.
        attendees:
          oneOf:
            - $ref: '#/components/schemas/Capacity'
            - type: 'null'
        startTime:
          oneOf:
            - $ref: '#/components/schemas/TimeOfDay'
            - type: 'null'
        endTime:
          oneOf:
            - $ref: '#/components/schemas/TimeOfDay'
            - type: 'null'
    UpdateEventTemplateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      description: Same fields as creation, all optional; at least one is required.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 80
        description:
          type: string
          minLength: 1
          maxLength: 1000
        type:
          $ref: '#/components/schemas/EventType'
        imageUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048
        attendees:
          oneOf:
            - $ref: '#/components/schemas/Capacity'
            - type: 'null'
        startTime:
          oneOf:
            - $ref: '#/components/schemas/TimeOfDay'
            - type: 'null'
        endTime:
          oneOf:
            - $ref: '#/components/schemas/TimeOfDay'
            - type: 'null'
    EventTemplatePage:
      type: object
      required: [items, page, pageSize, total, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/EventTemplate'
        page:
          type: integer
          minimum: 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 50
        total:
          type: integer
          minimum: 0
        totalPages:
          type: integer
          minimum: 0

    UploadImageResponse:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri

    CalendarEntry:
      type: object
      required:
        [
          id,
          date,
          capacity,
          attendeeCount,
          attendees,
          addedBy,
          template,
          createdAt,
          isAttending,
          canDelete,
        ]
      properties:
        id:
          $ref: '#/components/schemas/Uuid'
        date:
          $ref: '#/components/schemas/IsoDate'
        capacity:
          $ref: '#/components/schemas/Capacity'
        attendeeCount:
          type: integer
          minimum: 0
        attendees:
          type: array
          description: Ordered by sign-up time, oldest first.
          items:
            $ref: '#/components/schemas/UserSummary'
        addedBy:
          $ref: '#/components/schemas/UserSummary'
        template:
          $ref: '#/components/schemas/EventTemplate'
        createdAt:
          $ref: '#/components/schemas/IsoDateTime'
        isAttending:
          type: boolean
          description: The current user is attending. `false` without a session.
        canDelete:
          type: boolean
          description: The current user added this entry. `false` without a session.
    CalendarResponse:
      type: object
      required: [from, to, entries]
      properties:
        from:
          $ref: '#/components/schemas/IsoDate'
        to:
          $ref: '#/components/schemas/IsoDate'
        entries:
          type: array
          items:
            $ref: '#/components/schemas/CalendarEntry'
    CreateCalendarEntryRequest:
      type: object
      additionalProperties: false
      required: [templateId, date, capacity]
      properties:
        templateId:
          $ref: '#/components/schemas/Uuid'
        date:
          $ref: '#/components/schemas/IsoDate'
        capacity:
          $ref: '#/components/schemas/Capacity'
